name: Build ProtoForge Host APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.5
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Assemble Debug APK
        run: /opt/gradle/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload ProtoForge-Host.apk
        uses: actions/upload-artifact@v4
        with:
          name: ProtoForge-Host-APK
          path: app/build/outputs/apk/debug/app-debug.apk
