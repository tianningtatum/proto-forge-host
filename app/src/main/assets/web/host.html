<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>ProtoForge Host</title>
<link rel="stylesheet" href="style.css">
<style>
.joincard{background:var(--plate);border:2px solid var(--accent);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px}
.qr{background:#fff;border-radius:10px;padding:8px;width:168px;height:168px;display:flex;align-items:center;justify-content:center}
.qr img,.qr svg{width:152px;height:152px;image-rendering:pixelated}
.addr{font-family:var(--mono);font-weight:700;font-size:clamp(18px,5vw,26px);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.alt{font-family:var(--mono);font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.joincard p{margin:6px 0 0;color:var(--dim);font-size:14px;line-height:1.45}
.noip{color:#ff8a80;font-weight:600}
.sec2{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px;gap:10px}
.sec2 h2{font-size:24px;text-transform:uppercase}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.team{background:var(--plate);border:1px solid var(--edge);border-left:6px solid var(--tc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team .th{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.team h3{font-size:24px;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.team .pg{font-size:12px;color:var(--dim)}
.badge{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:5px;background:var(--plate2);color:var(--dim);white-space:nowrap}
.badge.run{background:rgba(255,194,26,.16);color:var(--accent)}
.badge.ok{background:rgba(53,198,111,.2);color:var(--go)}
.badge.bad{background:rgba(229,57,44,.2);color:#ff8a80}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nums div{background:var(--plate2);border-radius:8px;padding:6px 8px}
.nums b{display:block;font-family:var(--mono);font-size:20px}
.nums span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.ppl{display:flex;flex-wrap:wrap;gap:6px}
.tfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mini{background:transparent;border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--dim)}
.mini.arm{border-color:var(--stop);color:#ff8a80}
.empty{border:2px dashed var(--edge);border-radius:12px;padding:28px 16px;text-align:center;color:var(--dim)}
.tcard{background:var(--plate);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin:12px 0}
.tcard h3{font-size:20px;text-transform:uppercase;margin-bottom:8px;color:var(--accent)}
.tcard ul,.tcard ol{margin:0;padding-left:20px;line-height:1.55;font-size:14px}
.tcard li{margin-bottom:6px}
.tcard li b{color:var(--accent2);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:1px solid var(--edge);background:var(--plate2);border-radius:999px;padding:6px 12px;font-size:13px}
.tabs button.sel{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.verdict{border-radius:10px;padding:12px;margin-top:10px;font-weight:600}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{border:1px solid var(--edge);background:var(--plate2);border-radius:10px;font-size:24px;font-weight:700;min-height:48px}
.stepper output{display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:10px;font-family:var(--mono);font-size:24px;font-weight:700}
table.board{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.board td:nth-child(3){white-space:normal;font-size:12px;color:var(--dim)}
table.board th,table.board td{padding:8px 6px;border-bottom:1px solid var(--edge);text-align:left;white-space:nowrap}
table.board th{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
table.board td.pts{font-family:var(--mono);font-weight:700;color:var(--accent)}
table.board tr.wait td{color:var(--dim)}
.verdict.ok{background:rgba(53,198,111,.18);color:#8fe3b0}.verdict.bad{background:rgba(229,57,44,.18);color:#ff9a90}
@media (max-width:440px){.joincard{grid-template-columns:1fr;justify-items:center;text-align:center}}
</style>
</head>
<body>
<div class="hz"></div>
<div class="wrap" style="max-width:980px">
  <div class="brand" style="padding-bottom:0"><span class="prog">Host phone · ENTECH
